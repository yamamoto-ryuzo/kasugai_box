<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kasugai_box</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>kasugai_box</h1>

      <div class="tabs">
        <button class="tab-btn active" data-tab="photo">Photo</button>
        <button class="tab-btn" data-tab="mcp">BOXMCP</button>
        <button class="tab-btn" data-tab="login">ログイン</button>
        <button class="tab-btn" data-tab="settings">設定</button>
      </div>

      <section id="tab-photo" class="tab-panel active">
        <p>Boxフォルダ内の画像からEXIFの位置情報を抽出し、CSV・GeoJSONを出力します。</p>
        <div class="form">
          <label>
            フォルダURL
            <input type="text" id="folder-url" placeholder="https://app.box.com/folder/123456" />
          </label>
          <label>
            出力フォルダ名
            <input type="text" id="output-dir" value="box_photo_geo_url/output" />
          </label>
          <button id="run-btn" type="button">実行</button>
        </div>

        <div id="status"></div>

        <table id="results" hidden>
          <thead>
            <tr>
              <th>ファイル</th>
              <th>緯度</th>
              <th>経度</th>
              <th>撮影日</th>
              <th>URL</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section id="tab-mcp" class="tab-panel">
        <h2>BOXMCP 接続</h2>
        <p class="chat-intro">Box API への MCP 風チャット接続です。help / me / folder &lt;id&gt; / search &lt;q&gt; が使えます。search はファイル名だけでなく、メタデータ・文書内テキストも対象の Box 標準検索です。</p>
        <div class="chat-container" id="chat-container">
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="BOXMCP メッセージ（例: help, me, folder 0, search report）" />
            <button id="chat-send" type="button">送信</button>
          </div>
        </div>
      </section>

      <section id="tab-settings" class="tab-panel">
        <div class="form">
          <label>
            クライアントID
            <input type="text" id="mcp-client-id" placeholder="Box Client ID" />
          </label>
          <label>
            クライアントシークレット
            <input type="password" id="mcp-client-secret" placeholder="Box Client Secret" />
          </label>
          <label>
            デベロッパートークン（任意・1時間程度で失効）
            <input type="password" id="mcp-developer-token" placeholder="Box Developer Token" />
          </label>
          <hr />
          <h3>BOXMCP 接続設定</h3>
          <label>
            BOXMCP サーバーURL
            <input type="text" id="mcp-server-url" placeholder="https://example.com/mcp" />
          </label>
          <label>
            BOXMCP 接続トークン
            <input type="password" id="mcp-connection-token" placeholder="MCP connection token" />
          </label>
          <button id="mcp-save-settings" type="button">保存</button>
          <div id="mcp-settings-status"></div>
        </div>
      </section>

      <section id="tab-login" class="tab-panel">
        <div class="form">
          <p>設定タブでデベロッパートークン、またはクライアントIDとクライアントシークレットを入力してください。</p>
          <button id="mcp-developer-token-login" type="button">デベロッパートークンでログイン</button>
          <hr />
          <button id="mcp-oauth-auto" type="button">Box OAuth 自動ログイン（localhost）</button>
          <button id="mcp-oauth-logout" type="button">ログアウト</button>
          <div id="mcp-oauth-status"></div>
        </div>
      </section>


    </main>
  </body>
</html>
