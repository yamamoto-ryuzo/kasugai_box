name: Build release and deploy to Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-binary:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release
        working-directory: ./server

      - name: Create release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./download
          $zip = "./download/kasugai_box.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path ./server/target/release/kasugai_box.exe -DestinationPath $zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasugai_box-zip
          path: ./download/kasugai_box.zip

  build-site:
    runs-on: ubuntu-latest
    needs: build-binary
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: kasugai_box-zip
          path: ./download

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-site
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
