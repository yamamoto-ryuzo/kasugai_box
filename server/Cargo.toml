[package]
name = "kasugai_box"
version = "0.2.0"
description = "kasugai_box API sidecar (HTTP/REST/MCP server for KASUGAI)"
authors = ["you"]
edition = "2021"

[dependencies]
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.37", features = ["full"] }
csv = "1.3"
regex = "1.10"
kamadak-exif = "0.5"
futures = "0.3"
dirs = "5.0"
anyhow = "1.0"
keyring = "4.1"
opener = "0.8"
uuid = { version = "1", features = ["v4"] }
